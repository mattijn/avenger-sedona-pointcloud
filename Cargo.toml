[workspace]
resolver = "2"
members = [
    "common",
    "experiments/01-charts",
    "experiments/02-chart-language",
    "experiments/03-streaming",
    "experiments/05-coordinate-systems",
    "experiments/06-pipelines",
    "experiments/07-chart-decisions",
    "probes",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# One place to repin the Avenger stack. It currently points at the top of the
# PR stack (jonmmease/avenger#130, branch codex/portable-dataflow-inputs),
# which pins Arrow 58.4 and DataFusion 54.1 — semver-compatible with SedonaDB
# main, so Arrow arrays pass between them untouched.
[workspace.dependencies]
avenger-app = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761" }
avenger-chart = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761", default-features = false, features = ["png"] }
avenger-chart-definition = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761" }
avenger-color = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761" }
avenger-common = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761" }
avenger-datafusion-aggregate-state = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761" }
avenger-eventstream = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761" }
avenger-format-datetime = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761" }
avenger-format-number = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761" }
avenger-geo = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761" }
avenger-geometry = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761" }
avenger-guides = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761" }
avenger-resource = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761" }
avenger-scales = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761" }
avenger-scenegraph = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761" }
avenger-text = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761" }
avenger-transform = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761" }
avenger-wgpu = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761" }
avenger-widgets = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761" }
avenger-winit-wgpu = { git = "https://github.com/jonmmease/avenger", rev = "602b99cc0497d5fddda63c889037d1855e48c761" }

# SedonaDB's LAS/LAZ reader, a DataFusion file format. main is on DataFusion
# 54.1 / Arrow 58.3; the 0.4.1 release is on DataFusion 52.5 / Arrow 57.
sedona-pointcloud = { git = "https://github.com/apache/sedona-db", rev = "2f3e37815bd998a9b9e2accc51ce261ea69a5f0f" }

arrow = "58.3"
arrow-flight = "58.3"
async-trait = "0.1"
datafusion = "54.1"
futures = "0.3"
geo-types = "0.7.16"
image = "0.25"
lyon_path = "1.0.7"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tonic = "0.14"
winit = "0.30.11"
# COPC octree reader; 0.7.0 is unreleased (crates.io has 0.5.0, which fails to
# build with current las).
copc-rs = { git = "https://github.com/pka/copc-rs", rev = "7918657abc8ba767cdccf041b7b020c218029ace", features = ["laz-parallel"] }

lidar-common = { path = "common" }
