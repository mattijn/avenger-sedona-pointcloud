[workspace]
# probes-main pins Avenger main, whose geo 0.33 cannot share a graph with the
# geo 0.29 of the #130 rendering crates pinned below (i_float, FINDINGS 40).
exclude = ["probes-main"]
resolver = "2"
members = [
    "common",
    "crates/avenger-altair",
    "crates/avenger-coords",
    "crates/avenger-selection",
    "crates/avenger-transition",
    "crates/avenger-vegalite-py",
    "crates/avenger-vegalite-spec",
    "crates/avenger-validate",
    "experiments/01-charts",
    "experiments/02-chart-language",
    "experiments/03-streaming",
    "experiments/05-coordinate-systems",
    "experiments/06-pipelines",
    "experiments/07-chart-decisions",
    "experiments/10-mosaic-flights",
    "experiments/11-cloudlasso",
    "probes",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# One place to repin the Avenger stack. It currently points at the top of the
# PR stack (jonmmease/avenger#130, branch codex/portable-dataflow-inputs,
# rebased 14 Oct 2026),
# which pins Arrow 58.4 and DataFusion 54.1 — semver-compatible with SedonaDB
# main, so Arrow arrays pass between them untouched.
[workspace.dependencies]
avenger-app = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-chart = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d", default-features = false, features = ["png"] }
avenger-chart-definition = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-color = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-common = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-datafusion-aggregate-state = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-eventstream = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-format-datetime-d3 = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-format-number-d3 = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-geo = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-geometry = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-guides = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-resource = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-scales = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-scenegraph = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-typst-label = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d", features = ["bundled-fonts"] }
avenger-transform = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-datafusion-dataflow = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-datafusion-preaggregate = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-scales-datafusion = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-vegalite-compiler = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d", default-features = false, features = ["svg", "png"] }
avenger-vegalite-spec = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-wgpu = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-widgets = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }
avenger-winit-wgpu = { git = "https://github.com/jonmmease/avenger", rev = "d5f97387f41ad09d3434aeaecad041d962e2f35d" }

# SedonaDB's LAS/LAZ reader, a DataFusion file format. main is on DataFusion
# 54.1 / Arrow 58.3; the 0.4.1 release is on DataFusion 52.5 / Arrow 57.
sedona-pointcloud = { git = "https://github.com/apache/sedona-db", rev = "2f3e37815bd998a9b9e2accc51ce261ea69a5f0f" }

arrow = "58.3"
arrow-flight = "58.3"
async-trait = "0.1"
datafusion = "54.1"
futures = "0.3"
geo-types = "0.7.16"
image = "0.25"
lyon_path = "1.0.7"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tonic = "0.14"
winit = "0.30.11"
# COPC octree reader; 0.7.0 is unreleased (crates.io has 0.5.0, which fails to
# build with current las).
copc-rs = { git = "https://github.com/pka/copc-rs", rev = "7918657abc8ba767cdccf041b7b020c218029ace", features = ["laz-parallel"] }

lidar-common = { path = "common" }
avenger-coords = { path = "crates/avenger-coords" }
avenger-transition = { path = "crates/avenger-transition" }
avenger-selection = { path = "crates/avenger-selection" }

# Avenger's Vega-Lite spec types, carried in this repo with additions that are
# not upstream yet: a JSON Schema export, `config`, and `camera`
# (crates/avenger-vegalite-spec/VENDORED.md).
[patch."https://github.com/jonmmease/avenger"]
avenger-vegalite-spec = { path = "crates/avenger-vegalite-spec" }
