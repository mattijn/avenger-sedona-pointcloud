<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One route to Altair</title>
<meta name="description" content="Avenger's crates, the compositions on them, and one explored route towards an Altair generated from Avenger's schema.">
<style>
  /* Experiment 7's Theme::calm() (src/layer/theme.rs): white, black text,
     greys, one accent colour, one typeface throughout (pipeline text
     included), square corners, lines rather than filled areas, status in
     grey italic, and a translucent dark overlay for stats for nerds. */
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --ink: #000000;
    --muted: #595959;
    --kicker: #949494;
    --line: #b8b8b8;
    --grid: rgba(184, 184, 184, 0.45);
    --accent: #0099cc;
    --track: #eeeeee;
    --dark: rgba(0, 37, 50, 0.94);
    --dark-text: #ffffff;
    --dark-muted: #b8b8b8;
    --dark-accent: #33b5e0;
    --letterbox: #ececec;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--letterbox); overflow: hidden; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  #stage {
    position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px;
    transform-origin: 0 0; background: var(--bg); display: flex;
    box-shadow: 0 0 0 1px #dcdcdc;
  }
  #main { position: relative; width: 1180px; height: 900px; }
  #svg { width: 1180px; height: 900px; display: block; }
  #panel {
    width: 420px; height: 900px; background: var(--panel); padding: 44px 36px 30px;
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  .kick { font-size: 14px; color: var(--kicker); letter-spacing: .02em; }
  #title { font-size: 34px; font-weight: 700; margin: 6px 0 26px; line-height: 1.1; }
  #big { font-size: 40px; font-weight: 700; line-height: 1; min-height: 40px; }
  #bigsub { font-size: 15px; color: var(--muted); margin: 6px 0 22px; min-height: 18px; }
  #rows { border-top: 1px solid var(--line); padding-top: 16px; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: 16px; line-height: 1.95;
         opacity: 0; transition: opacity .45s; }
  .row.on { opacity: 1; }
  .row span:first-child { color: var(--muted); }
  .row span:last-child { font-weight: 700; text-align: right; }
  #hover { margin-top: 18px; min-height: 48px; font-size: 16px; font-style: italic; color: var(--muted); }
  #foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between;
          font-size: 13px; color: var(--kicker); }
  #dots { display: flex; gap: 3px; }
  #dots i { width: 7px; height: 7px; border: 1px solid var(--line); display: block; cursor: pointer; }
  #dots i.on { background: var(--ink); border-color: var(--ink); }
  #nav button { font: inherit; font-size: 13px; background: none; border: 1px solid var(--line);
                color: var(--muted); padding: 3px 10px; cursor: pointer; }
  #nav button:hover { border-color: var(--accent); color: var(--accent); }
  #nerds {
    position: absolute; inset: 16px; background: var(--dark); color: var(--dark-text);
    font-size: 15px; line-height: 1.75;
    padding: 22px 26px; white-space: pre-wrap; display: none; overflow: auto;
  }
  #nerds.on { display: block; }
  #nerds b { color: var(--dark-accent); font-weight: 400; }
  #nerds em { color: var(--dark-muted); font-style: normal; }
  #nerds code { color: var(--dark-text); font-family: inherit; }

  /* SVG */
  svg text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .lab { font-size: 17px; }
  .sub { font-size: 13px; fill: var(--muted); }
  .kk { font-size: 13px; fill: var(--kicker); letter-spacing: .02em; }
  .num { font-size: 13px; fill: var(--muted); }
  .val { font-size: 14px; font-weight: 700; }
  .mono { font-size: 14px; }
  .bignum { font-size: 44px; font-weight: 700; }
  .elab { font-size: 13px; fill: var(--muted); paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
  .box { fill: #fff; stroke: var(--line); stroke-width: 1.2; }
  .box.acc { stroke: var(--accent); stroke-width: 2; }
  .box.solid { stroke: var(--ink); stroke-width: 1.6; }
  .box.warn { stroke: var(--accent); stroke-width: 2.4; }
  .box.ext { stroke-dasharray: 5 4; }
  .box.ghost { stroke-dasharray: 3 4; fill: none; }
  .box.dark { fill: #002532; stroke: none; }
  #nav button.on { border-color: var(--accent); color: var(--accent); }
  .edge { fill: none; stroke: #949494; stroke-width: 1.3; }
  .edge.acc { stroke: var(--accent); stroke-width: 2; }
  .edge.warn { stroke: var(--accent); stroke-width: 1.8; }
  .edge.dash { stroke-dasharray: 5 5; }
  .flow { stroke-dasharray: 6 7; animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -13; } }
  [data-s] { opacity: 0; transition: opacity .5s; }
  [data-s].on { opacity: 1; }
  .dim { transition: opacity .25s; }
  svg.focus .dim:not(.hl) { opacity: .14; }
  .hot { cursor: default; }
  .hot:hover .box { stroke: var(--accent); }
  .axis { stroke: var(--grid); stroke-width: 1; }
  .track { fill: var(--track); }
  /* Touch: big fixed controls outside the scaled stage, so a finger fits. */
  html { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #touch, #rotate { display: none; }
  body.touch #touch { display: block; }
  #touch button {
    position: fixed; z-index: 10; border: none; background: transparent; color: #949494;
    font: inherit; padding: 0; cursor: pointer;
  }
  #tprev, #tnext { top: 0; bottom: 0; width: max(64px, calc((100vw - 100vh * 16 / 9) / 2)); font-size: 44px; }
  #tprev { left: 0; } #tnext { right: 0; }
  #tprev:active, #tnext:active { background: rgba(0, 153, 204, 0.08); color: #0099cc; }
  #tnerd {
    top: 10px; right: 10px; width: 56px; height: 56px; font-size: 22px;
    border: 1px solid #b8b8b8 !important; background: rgba(255, 255, 255, 0.9) !important;
  }
  #tnerd.on { color: #0099cc; border-color: #0099cc !important; }
  #tcount { position: fixed; z-index: 10; bottom: 10px; right: 14px; font-size: 16px; color: #949494; }
  @media (orientation: portrait) {
    body.touch #rotate { display: flex; position: fixed; inset: 0; z-index: 20; background: #fff;
                         align-items: center; justify-content: center; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="main">
    <svg id="svg" viewBox="0 0 1180 900" aria-label="slide"></svg>
    <div id="nerds"></div>
  </div>
  <aside id="panel">
    <div class="kick" id="kicker"></div>
    <div id="title"></div>
    <div id="big"></div>
    <div id="bigsub"></div>
    <div id="rows"></div>
    <div id="hover"></div>
    <div id="foot">
      <div id="dots"></div>
      <div id="nav"><button id="prev" aria-label="back">‹</button> <button id="next" aria-label="next">›</button> <button id="nerdbtn">stats for nerds</button></div>
    </div>
  </aside>
</div>

<div id="touch">
  <button id="tprev" aria-label="back">‹</button>
  <button id="tnext" aria-label="next">›</button>
  <button id="tnerd" aria-label="stats for nerds">{ }</button>
  <div id="tcount"></div>
</div>
<div id="rotate" aria-label="turn the phone sideways">
  <svg width="160" height="160" viewBox="0 0 160 160">
    <rect x="58" y="30" width="44" height="80" fill="none" stroke="#b8b8b8" stroke-width="3"/>
    <rect x="40" y="88" width="80" height="44" fill="none" stroke="#0099cc" stroke-width="3"/>
    <path d="M118,52 a34,34 0 0 1 12,30" fill="none" stroke="#0099cc" stroke-width="3"/>
    <path d="M124,80 l6,8 l6,-9" fill="none" stroke="#0099cc" stroke-width="3"/>
  </svg>
</div>

<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");
// Theme::calm(): blue and grey only.
const C = {
  ink: "#000", muted: "#595959", kicker: "#949494", line: "#b8b8b8", accent: "#0099cc",
  bar: "#595959", barSoft: "#b8b8b8", track: "#eeeeee", warn: "#0099cc", grid: "rgba(184,184,184,0.45)",
  dark: "#002532", darkText: "#ffffff", darkMuted: "#b8b8b8", darkAccent: "#33b5e0", tint: "#e5f5fa",
};

// ---------------------------------------------------------------- drawing

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs || {}) {
    if (k === "text") e.textContent = attrs[k];
    else if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
  }
  (parent || svg).appendChild(e);
  return e;
}

let NODES = {}, EDGES = [], EDGE_LAYER = null;

function layer(s, parent) {
  const g = el("g", {}, parent);
  if (s !== undefined && s !== null) g.setAttribute("data-s", s);
  return g;
}

function text(x, y, t, cls, o = {}) {
  const e = el("text", { x, y, class: cls || "lab", "text-anchor": o.anchor || "start",
                         style: (o.fill ? "fill:" + o.fill + ";" : "") + (o.size ? "font-size:" + o.size + "px;" : "")
                                + (o.bold ? "font-weight:700;" : "") || null,
                         "font-style": o.italic ? "italic" : null }, o.parent);
  const lines = String(t).split("\n");
  if (lines.length === 1) e.textContent = t;
  else lines.forEach((l, i) => el("tspan", { x, dy: i ? (o.lh || 18) : 0, text: l }, e));
  return e;
}

// A node: square corners, a line, a label and an optional sub-label.
function box(id, x, y, w, h, o = {}) {
  const g = layer(o.s, o.parent);
  const inner = el("g", { class: "dim hot", "data-id": id }, g);
  el("rect", { x, y, width: w, height: h, class: "box " + (o.kind || "") }, inner);
  const cx = x + w / 2;
  const light = o.kind && o.kind.includes("dark");
  if (o.label !== undefined) {
    const hasSub = o.sub !== undefined;
    const ly = y + h / 2 + (hasSub ? -3 : 6);
    text(o.align === "left" ? x + 14 : cx, ly, o.label, o.labcls || "lab",
         { anchor: o.align === "left" ? "start" : "middle", parent: inner, bold: o.bold,
           fill: light ? "#fff" : (o.labfill || null), size: o.size });
    if (hasSub) text(o.align === "left" ? x + 14 : cx, ly + 19, o.sub, "sub",
                     { anchor: o.align === "left" ? "start" : "middle", parent: inner,
                       fill: light ? "#b8b8b8" : (o.subfill || null) });
  }
  if (o.title) el("title", { text: o.title }, inner);
  NODES[id] = { x, y, w, h, cx, cy: y + h / 2, g: inner };
  return inner;
}

function person(id, cx, cy, label, o = {}) {
  const g = layer(o.s, o.parent);
  const inner = el("g", { class: "dim hot", "data-id": id }, g);
  el("circle", { cx, cy: cy - 22, r: 13, fill: "#fff", stroke: o.color || C.ink, "stroke-width": 1.5 }, inner);
  el("path", { d: `M${cx - 26},${cy + 22} q0,-30 26,-30 q26,0 26,30`, fill: "#fff",
               stroke: o.color || C.ink, "stroke-width": 1.5 }, inner);
  text(cx, cy + 46, label, "lab", { anchor: "middle", parent: inner });
  if (o.sub) text(cx, cy + 65, o.sub, "sub", { anchor: "middle", parent: inner });
  NODES[id] = { x: cx - 34, y: cy - 40, w: 68, h: 66, cx, cy, g: inner };
  return inner;
}

function anchor(n, tx, ty) {
  const dx = tx - n.cx, dy = ty - n.cy;
  if (!dx && !dy) return [n.cx, n.cy];
  const t = Math.min(n.w / 2 / Math.abs(dx || 1e-9), n.h / 2 / Math.abs(dy || 1e-9));
  return [n.cx + dx * t, n.cy + dy * t];
}

// An edge between two nodes; `bend` curves it sideways, `from`/`to` pick
// a side ("t", "b", "l", "r") instead of the straight line between centres.
function edge(a, b, o = {}) {
  const A = NODES[a], B = NODES[b];
  const side = (n, s, other) => s === "t" ? [n.cx + (o.dx1 || 0), n.y] : s === "b" ? [n.cx + (o.dx1 || 0), n.y + n.h]
    : s === "l" ? [n.x, n.cy] : s === "r" ? [n.x + n.w, n.cy] : anchor(n, other.cx, other.cy);
  const p1 = o.from ? side(A, o.from, B) : anchor(A, B.cx, B.cy);
  let p2 = o.to ? (o.to === "t" ? [B.cx + (o.dx2 || 0), B.y] : o.to === "b" ? [B.cx + (o.dx2 || 0), B.y + B.h]
    : o.to === "l" ? [B.x, B.cy] : [B.x + B.w, B.cy]) : anchor(B, A.cx, A.cy);
  const g = layer(o.s, o.parent || EDGE_LAYER);
  const inner = el("g", { class: "dim", "data-a": a, "data-b": b }, g);
  let d;
  if (o.curve === "v") {
    const my = (p1[1] + p2[1]) / 2;
    d = `M${p1[0]},${p1[1]} C${p1[0]},${my} ${p2[0]},${my} ${p2[0]},${p2[1]}`;
  } else if (o.curve === "h") {
    const mx = (p1[0] + p2[0]) / 2;
    d = `M${p1[0]},${p1[1]} C${mx},${p1[1]} ${mx},${p2[1]} ${p2[0]},${p2[1]}`;
  } else if (o.bend) {
    const mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2;
    const nx = -(p2[1] - p1[1]), ny = p2[0] - p1[0], L = Math.hypot(nx, ny) || 1;
    d = `M${p1[0]},${p1[1]} Q${mx + nx / L * o.bend},${my + ny / L * o.bend} ${p2[0]},${p2[1]}`;
  } else if (o.via) {
    d = `M${p1[0]},${p1[1]} ` + o.via.map(p => `L${p[0]},${p[1]}`).join(" ") + ` L${p2[0]},${p2[1]}`;
  } else d = `M${p1[0]},${p1[1]} L${p2[0]},${p2[1]}`;
  const kind = o.kind || "";
  const marker = kind.includes("acc") ? "url(#arrA)" : kind.includes("warn") ? "url(#arrW)" : "url(#arr)";
  const path = el("path", { d, class: "edge " + kind + (o.flow ? " flow" : ""),
                            "marker-end": o.noarrow ? null : marker }, inner);
  if (o.label) {
    const len = path.getTotalLength ? path.getTotalLength() : 0;
    const pt = len ? path.getPointAtLength(len * (o.at || 0.5)) : { x: (p1[0] + p2[0]) / 2, y: (p1[1] + p2[1]) / 2 };
    text(pt.x + (o.lx || 0), pt.y + 4 + (o.ly || 0), o.label, "elab", { anchor: "middle", parent: inner });
  }
  EDGES.push({ a, b, g: inner });
  return path;
}

function image(href, x, y, w, h, o = {}) {
  const g = layer(o.s, o.parent);
  const id = "clip" + Math.random().toString(36).slice(2);
  const cp = el("clipPath", { id }, el("defs", {}, g));
  el("rect", { x, y, width: w, height: h }, cp);
  el("image", { href, x, y, width: w, height: h, preserveAspectRatio: o.fit || "xMidYMid slice",
                "clip-path": `url(#${id})` }, g);
  if (o.frame !== false) el("rect", { x, y, width: w, height: h, fill: "none", stroke: "#dcdfe3" }, g);
  return g;
}

// Horizontal bars in the style of Jev's confidence bars.
function bars(x, y, rows, o = {}) {
  const g = layer(o.s, o.parent);
  const lw = o.labelW || 150, tw = o.trackW || 260, rh = o.rowH || 30;
  const max = o.max || Math.max(...rows.map(r => r[1]));
  const min = o.min || 1;
  const scale = v => o.log ? Math.max(0.004, (Math.log10(v) - Math.log10(min)) / (Math.log10(max) - Math.log10(min)))
                           : v / max;
  if (o.head) text(x, y - 14, o.head, "kk", { parent: g });
  rows.forEach((r, i) => {
    const yy = y + i * rh;
    const rg = layer(r[4] !== undefined ? r[4] : null, g);
    text(x, yy + 12, r[0], "lab", { parent: rg, size: 15, bold: !!r[5], fill: r[5] ? C.ink : C.muted });
    el("rect", { x: x + lw, y: yy + 2, width: tw, height: 12, class: "track" }, rg);
    el("rect", { x: x + lw, y: yy + 2, width: Math.max(2, tw * scale(r[1])), height: 12,
                 fill: r[3] || C.bar }, rg);
    text(x + lw + tw + 12, yy + 13, r[2], "val", { parent: rg, fill: r[3] === C.warn ? C.warn : null });
  });
  return g;
}


// Drawn pictures, in the calm theme's blue and grey. They stand for the
// experiments' charts; they are not data.
function rnd(seed) { let v = seed; return () => (v = (v * 16807) % 2147483647) / 2147483647; }

const G = {
  // A top view: blocks, streets, a diagonal road, buildings in the accent.
  tile(x, y, w, h, o = {}) {
    const g = layer(o.s, o.parent), n = o.n || 32, cw = w / n, ch = h / n, r = rnd(o.seed || 11);
    const upto = o.fill === undefined ? 1 : o.fill;
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      const street = i % 6 === 0 || j % 6 === 0 || Math.abs(i - j - 4) < 1;
      const v = r();
      if (j / n > upto) continue;
      const f = street ? "#e6e6e6" : v > 0.84 ? C.accent : v > 0.5 ? "#7a7a7a" : v > 0.22 ? "#a8a8a8" : "#cfcfcf";
      el("rect", { x: x + i * cw, y: y + j * ch, width: cw - (n > 40 ? 0.6 : 1), height: ch - (n > 40 ? 0.6 : 1), fill: f }, g);
    }
    if (o.frame !== false) el("rect", { x, y, width: w, height: h, fill: "none", stroke: C.line }, g);
    return g;
  },
  bars(x, y, w, h, vals, o = {}) {
    const g = layer(o.s, o.parent), bw = w / vals.length, max = Math.max(...vals);
    vals.forEach((v, i) => el("rect", { x: x + i * bw + bw * 0.15, y: y + h - h * v / max, width: bw * 0.7,
      height: h * v / max, fill: i === (o.hi === undefined ? -1 : o.hi) ? C.accent : "#949494" }, g));
    el("line", { x1: x, y1: y + h, x2: x + w, y2: y + h, stroke: C.line }, g);
    return g;
  },
  line(x, y, w, h, o = {}) {
    const g = layer(o.s, o.parent), r = rnd(o.seed || 3);
    for (let k = 0; k < (o.series || 3); k++) {
      let p = "", v = 0.5;
      for (let i = 0; i <= 20; i++) { v = Math.min(0.95, Math.max(0.05, v + (r() - 0.5) * 0.25)); p += (i ? "L" : "M") + (x + w * i / 20) + "," + (y + h * (1 - v)); }
      el("path", { d: p, fill: "none", stroke: k === 0 ? C.accent : "#a8a8a8", "stroke-width": k === 0 ? 2.2 : 1.4 }, g);
    }
    el("line", { x1: x, y1: y + h, x2: x + w, y2: y + h, stroke: C.line }, g);
    return g;
  },
  arc(cx, cy, R, vals, o = {}) {
    const g = layer(o.s, o.parent), tot = vals.reduce((a, b) => a + b, 0), ri = R * (o.inner || 0.55);
    let a0 = -Math.PI / 2;
    vals.forEach((v, i) => {
      const a1 = a0 + 2 * Math.PI * v / tot, big = a1 - a0 > Math.PI ? 1 : 0;
      const P = (r, a) => `${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`;
      el("path", { d: `M${P(R, a0)} A${R},${R} 0 ${big} 1 ${P(R, a1)} L${P(ri, a1)} A${ri},${ri} 0 ${big} 0 ${P(ri, a0)} Z`,
        fill: i === (o.hi || 0) ? C.accent : ["#595959", "#949494", "#b8b8b8", "#d6d6d6"][i % 4], stroke: "#fff", "stroke-width": 1.5 }, g);
      a0 = a1;
    });
    return g;
  },
  // Bars leaning back, the tilt into 3D.
  tilt(x, y, w, h, vals, o = {}) {
    const g = layer(o.s, o.parent), bw = w / vals.length, max = Math.max(...vals), dx = bw * 0.35, dy = -bw * 0.25;
    vals.forEach((v, i) => {
      const bx = x + i * bw * 0.8 + i * dx * 0.2, by = y + h - i * dy * -0.6, bh = (h * 0.8) * v / max;
      const f = i === (o.hi || 0) ? C.accent : "#949494";
      el("path", { d: `M${bx},${by} l0,${-bh} l${dx},${dy} l0,${bh} z`, fill: "#595959" }, g);
      el("path", { d: `M${bx - bw * 0.45},${by - dy * 0} l${bw * 0.45},0 l0,${-bh} l${-bw * 0.45},0 z`, fill: f }, g);
      el("path", { d: `M${bx - bw * 0.45},${by - bh} l${bw * 0.45},0 l${dx},${dy} l${-bw * 0.45},0 z`, fill: "#cfcfcf" }, g);
    });
    return g;
  },
  // Lines of pipeline or chart text on the dark overlay, one typeface.
  code(x, y, w, lines, o = {}) {
    const g = layer(o.s, o.parent);
    el("rect", { x, y, width: w, height: 22 + lines.length * 22, fill: C.dark }, g);
    lines.forEach((l, i) => text(x + 14, y + 26 + i * 22, l, "mono", { parent: g, fill: i === (o.hi === undefined ? -1 : o.hi) ? "#fff" : C.darkAccent }));
    return g;
  },
};

function defs() {
  const d = el("defs", {});
  for (const [id, col] of [["arr", "#949494"], ["arrA", C.accent], ["arrW", C.accent]]) {

                             orient: "auto-start-reverse" }, d);
    el("path", { d: "M0,0 L10,5 L0,10 z", fill: col }, m);
  }
}

// Hover a node: everything not connected to it fades.
function wireHover(hoverText) {
  if (document.body.classList.contains("touch")) return;   // a tap is not a hover
  svg.querySelectorAll(".hot").forEach(n => {
    const id = n.getAttribute("data-id");
    n.addEventListener("mouseenter", () => {
      svg.classList.add("focus");
      n.classList.add("hl");
      EDGES.forEach(e => {
        if (e.a === id || e.b === id) {
          e.g.classList.add("hl");
          const other = e.a === id ? e.b : e.a;
          if (NODES[other]) NODES[other].g.classList.add("hl");
        }
      });
      if (hoverText && hoverText[id]) document.getElementById("hover").textContent = hoverText[id];
    });
    n.addEventListener("mouseleave", () => {
      svg.classList.remove("focus");
      svg.querySelectorAll(".hl").forEach(x => x.classList.remove("hl"));
      document.getElementById("hover").textContent = "";
    });
  });
}

// A chip in the ground: what already stands, drawn heaviest.
function chip(id, x, y, label, o = {}) {
  const w = o.w || Math.max(64, 18 + label.length * 8.1);
  box(id, x, y, w, o.h || 34, { label, size: o.size || 15, kind: o.kind || "solid", s: o.s, parent: o.parent });
  return w;
}

// The ground as bands, one per crate family, for the slides that stand on it.
function ground(y, o = {}) {
  const g = layer(o.s);
  const h = o.h || 22, x0 = o.x || 60, w = o.w || 1060;
  FAMILIES.slice().reverse().forEach((f, i) => {
    const yy = y - i * (h + 4);
    el("rect", { x: x0, y: yy, width: w, height: h, fill: "#fff", stroke: C.ink, "stroke-width": 1.4 }, g);
    text(x0 + 10, yy + 16, f, "sub", { parent: g, fill: C.ink });
  });
  return (f) => y - FAMILIES.slice().reverse().indexOf(f) * (h + 4) + h / 2;
}

function marker(x, y, n, label, s) {

// A fork: the way this repo went (blue), and ways it could go (dotted).
function fork(x, y, taken, alts, s) {
  const g = layer(s);
  el("circle", { cx: x, cy: y, r: 5, fill: C.ink }, g);

    text(tx + 12, ty + 5, t, "lab", { parent: g, size: 16, fill: i ? C.muted : C.accent, bold: !i });
  });

}

// ---------------------------------------------------------------- engine

let cur = 0, step = 0;
const nerds = document.getElementById("nerds");

function render() {
  const S = SLIDES[cur];
  svg.innerHTML = ""; NODES = {}; EDGES = [];
  svg.classList.remove("focus");
  defs();
  EDGE_LAYER = el("g", {});
  S.draw();
  wireHover(S.hover);
  document.getElementById("kicker").textContent = String(cur + 1).padStart(2, "0") + " / " + SLIDES.length;
  document.getElementById("title").textContent = S.title;
  document.getElementById("big").textContent = S.big || "";
  document.getElementById("bigsub").textContent = S.bigsub || "";
  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  (S.rows || []).forEach(r => {
    const d = document.createElement("div");
    d.className = "row"; d.dataset.s = r[2] || 0;
    d.innerHTML = `<span></span><span></span>`;
    d.children[0].textContent = r[0]; d.children[1].textContent = r[1];
    rows.appendChild(d);
  });
  nerds.innerHTML = S.nerds || "";
  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  SLIDES.forEach((_, i) => {
    const d = document.createElement("i");
    if (i === cur) d.className = "on";
    d.onclick = () => go(i, 0);
    dots.appendChild(d);
  });
  show();
}

function show() {
  document.querySelectorAll("[data-s]").forEach(e => {
    e.classList.toggle("on", Number(e.dataset.s) <= step);
  });
  document.querySelectorAll("svg [data-s]").forEach(e => {
    e.classList.toggle("on", Number(e.getAttribute("data-s")) <= step);
  });
  history.replaceState(null, "", location.search + "#" + (cur + 1) + (step ? "." + step : ""));
  const tc = document.getElementById("tcount");
  if (tc) tc.textContent = (cur + 1) + " / " + SLIDES.length;
}

function go(i, s) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  step = s === "end" ? SLIDES[cur].steps - 1 : s;
  render();
}

function next() {
  if (step < SLIDES[cur].steps - 1) { step++; show(); }
  else if (cur < SLIDES.length - 1) go(cur + 1, 0);
}
function prev() {
  if (step > 0) { step--; show(); }
  else if (cur > 0) go(cur - 1, "end");
}

document.addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); next(); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === "Home") go(0, 0);
  else if (e.key === "End") go(SLIDES.length - 1, "end");
  else if (e.key === "Tab") { e.preventDefault(); nerds.classList.toggle("on"); }
  else if (e.key === "Escape") nerds.classList.remove("on");
  else if (e.key === "f") document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
});
document.getElementById("next").onclick = next;
document.getElementById("prev").onclick = prev;
document.getElementById("nerdbtn").onclick = () => nerds.classList.toggle("on");


// Touch: tap the slide to go on (its left third goes back), swipe either
// way, or use the big controls in the margins. ?touch forces this look.
const coarse = window.matchMedia("(pointer: coarse)").matches || /[?&]touch\b/.test(location.search);
if (coarse) document.body.classList.add("touch");
document.getElementById("tprev").onclick = prev;
document.getElementById("tnext").onclick = next;
document.getElementById("tnerd").onclick = () => {
  nerds.classList.toggle("on");
  document.getElementById("tnerd").classList.toggle("on", nerds.classList.contains("on"));
};
let t0 = null;
const stage = document.getElementById("stage");
stage.addEventListener("touchstart", e => { t0 = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() }; }, { passive: true });
stage.addEventListener("touchend", e => {
  if (!t0) return;
  const t = e.changedTouches[0], dx = t.clientX - t0.x, dy = t.clientY - t0.y;
  const quick = Date.now() - t0.t < 600;
  t0 = null;
  if (e.target.closest("button, #dots i")) return;
  if (nerds.classList.contains("on")) { nerds.classList.remove("on"); document.getElementById("tnerd").classList.remove("on"); return; }
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); return; }
  if (quick && Math.abs(dx) < 12 && Math.abs(dy) < 12) {
    const r = stage.getBoundingClientRect();
    (t.clientX - r.left) < r.width * 0.3 ? prev() : next();
  }
}, { passive: true });

function fit() {
  const st = document.getElementById("stage");
  const k = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
  st.style.transform = `scale(${k}) translate(-50%, -50%)`;
}
window.addEventListener("resize", fit);
fit();

// #3 opens slide 3, #3.2 its third step; ?all shows every step (for stills).
(function start() {
  const m = location.hash.match(/^#(\d+)(?:\.(\d+))?/);
  const all = /[?&]all\b/.test(location.search);
  const i = m ? Number(m[1]) - 1 : 0;
  go(i, all ? "end" : (m && m[2] ? Number(m[2]) : 0));
})();
</script>
</body>
