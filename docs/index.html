<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One route to Altair</title>
<meta name="description" content="Avenger's crates, the compositions on them, and one explored route towards an Altair generated from Avenger's schema.">
<style>
  /* The colours of the Vega-Altair logo: light blue bars (#03A9F4,
     #4FC3F7, #B3E5FC) and an amber triangle (#FBC02D). Blue carries the
     route, amber marks what stands out. Black outlines are what already
     stands in the crates; one typeface, square corners. */
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --ink: #000000;
    --muted: #595959;
    --kicker: #949494;
    --line: #b8b8b8;
    --grid: rgba(184, 184, 184, 0.45);
    --accent: #03a9f4;
    --accent-text: #0277bd;
    --amber: #fbc02d;
    --track: #e1f5fe;
    --dark: rgba(1, 87, 155, 0.96);
    --dark-text: #ffffff;
    --dark-muted: #b8b8b8;
    --dark-accent: #b3e5fc;
    --letterbox: #ececec;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--letterbox); overflow: hidden; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  #stage {
    position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px;
    transform-origin: 0 0; background: var(--bg); display: flex;
    box-shadow: 0 0 0 1px #dcdcdc;
  }
  #main { position: relative; width: 1180px; height: 900px; }
  #svg { width: 1180px; height: 900px; display: block; }
  #panel {
    width: 420px; height: 900px; background: var(--panel); padding: 44px 36px 30px;
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  .kick { font-size: 14px; color: var(--kicker); letter-spacing: .02em; }
  #title { font-size: 34px; font-weight: 700; margin: 6px 0 26px; line-height: 1.1; }
  #big { font-size: 40px; font-weight: 700; line-height: 1; min-height: 40px; }
  #bigsub { font-size: 15px; color: var(--muted); margin: 6px 0 22px; min-height: 18px; }
  #rows { border-top: 1px solid var(--line); padding-top: 16px; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: 16px; line-height: 1.8;
         opacity: 0; transition: opacity .45s; }
  .row.on { opacity: 1; }
  .row span:first-child { color: var(--muted); }
  .row span:last-child { font-weight: 700; text-align: right; }
  #media { margin-top: 18px; flex: 0 1 auto; min-height: 0; overflow-y: auto; }
  #media .kick { margin-bottom: 4px; }
  #media button {
    display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: none;
    border-top: 1px solid #e6e6e6; padding: 5px 0; font: inherit; font-size: 14px; color: var(--ink);
    cursor: pointer; text-align: left;
  }
  #media button:hover { color: var(--accent-text); }
  .ico { flex: none; width: 18px; height: 18px; position: relative; }
  .ico.video { background: var(--amber); }
  .ico.video::after { content: ""; position: absolute; left: 6px; top: 4px; border-left: 8px solid #fff;
                      border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
  .ico.img { border: 2px solid var(--accent); }
  #modal {
    position: absolute; inset: 0; z-index: 30; display: none;
    background: rgba(1, 30, 50, 0.62); cursor: pointer;
  }
  #modal.on { display: block; }
  #mbox {
    position: absolute; inset: 44px 72px; background: #fff; cursor: default;
    display: flex; flex-direction: column; padding: 30px 90px 24px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
  }
  #modal .frame { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #modal img, #modal video { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 0 0 1px #dcdcdc; background: #fff; }
  #modal .cap { margin-top: 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 24px; }
  #modal .cap b { font-size: 20px; }
  #modal .cap .src { font-size: 14px; color: var(--muted); text-align: right; }
  #modal .cap .cmd { display: block; color: var(--accent-text); }
  #modal button { position: absolute; background: #fff; border: 1px solid var(--line); color: var(--muted);
                  font: inherit; cursor: pointer; width: 56px; height: 56px; font-size: 28px; }
  #modal button:hover { border-color: var(--accent); color: var(--accent-text); }
  #mclose { top: 18px; right: 18px; }
  #mprev { left: 18px; top: 50%; margin-top: -28px; }
  #mnext { right: 18px; top: 50%; margin-top: -28px; }
  #mcount { position: absolute; top: 30px; left: 90px; font-size: 14px; color: var(--kicker); }
  .media-link { cursor: pointer; }
  #mframe { gap: 28px; }
  #mframe .pipe { flex: 0 0 420px; align-self: center; background: #01579b; color: #b3e5fc; padding: 20px 22px;
                  font-size: 14px; line-height: 1.55; max-height: 100%; overflow: auto; }
  #mframe .pipe div { padding: 3px 0; }
  #mframe .pipe .pk { color: var(--amber); margin-bottom: 6px; }
  #mframe .pipe .hi { color: #fff; }
  #mframe img, #mframe video { min-width: 0; }
  .finding { max-width: 820px; width: 100%; align-self: center; }
  .finding .fk { font-size: 15px; color: var(--kicker); margin-bottom: 8px; }
  .finding h2 { font-size: 34px; margin: 0 0 30px; line-height: 1.15; }
  .finding .lbl { font-size: 14px; color: var(--kicker); margin: 18px 0 4px; }
  .finding p { font-size: 20px; line-height: 1.5; margin: 0; }
  .finding p.q { font-style: italic; color: var(--muted); }
  .finding .st { display: inline-block; padding: 2px 10px; border: 1.5px solid var(--accent); color: var(--accent-text); font-size: 14px; margin-left: 8px; }
  #hover { margin-top: 18px; min-height: 48px; font-size: 16px; font-style: italic; color: var(--muted); }
  #foot { margin-top: auto; padding-top: 10px; flex: none; display: flex; align-items: center; justify-content: space-between;
          font-size: 13px; color: var(--kicker); }
  #dots { display: flex; gap: 3px; }
  #dots i { width: 7px; height: 7px; border: 1px solid var(--line); display: block; cursor: pointer; }
  #dots i.on { background: var(--ink); border-color: var(--ink); }
  #nav button { font: inherit; font-size: 13px; background: none; border: 1px solid var(--line);
                color: var(--muted); padding: 3px 10px; cursor: pointer; }
  #nav button:hover { border-color: var(--accent); color: var(--accent-text); }
  #logo { display: block; margin-bottom: 14px; }
  #nerds {
    position: absolute; inset: 16px; background: var(--dark); color: var(--dark-text);
    font-size: 15px; line-height: 1.75;
    padding: 22px 26px; white-space: pre-wrap; display: none; overflow: auto;
  }
  #nerds.on { display: block; }
  #nerds b { color: var(--amber); font-weight: 400; }
  #nerds em { color: var(--dark-muted); font-style: normal; }
  #nerds code { color: var(--dark-text); font-family: inherit; }

  /* SVG */
  svg text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .lab { font-size: 17px; }
  .sub { font-size: 13px; fill: var(--muted); }
  .kk { font-size: 13px; fill: var(--kicker); letter-spacing: .02em; }
  .num { font-size: 13px; fill: var(--muted); }
  .val { font-size: 14px; font-weight: 700; }
  .mono { font-size: 14px; }
  .bignum { font-size: 44px; font-weight: 700; }
  .elab { font-size: 13px; fill: var(--muted); paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
  .box { fill: #fff; stroke: var(--line); stroke-width: 1.2; }
  .box.acc { stroke: var(--accent); stroke-width: 2; }
  .box.solid { stroke: var(--ink); stroke-width: 1.6; }
  .box.warn { stroke: var(--accent); stroke-width: 2.4; }
  .box.ext { stroke-dasharray: 5 4; }
  .box.ghost { stroke-dasharray: 3 4; fill: none; }
  .box.dark { fill: #01579b; stroke: none; }
  #nav button.on { border-color: var(--accent); color: var(--accent); }
  .edge { fill: none; stroke: #949494; stroke-width: 1.3; }
  .edge.acc { stroke: var(--accent); stroke-width: 2; }
  .edge.warn { stroke: var(--accent); stroke-width: 1.8; }
  .edge.dash { stroke-dasharray: 5 5; }
  .flow { stroke-dasharray: 6 7; animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -13; } }
  [data-s] { opacity: 0; transition: opacity .5s; }
  [data-s].on { opacity: 1; }
  .dim { transition: opacity .25s; }
  svg.focus .dim:not(.hl) { opacity: .14; }
  .hot { cursor: default; }
  .hot:hover .box { stroke: var(--accent); }
  .axis { stroke: var(--grid); stroke-width: 1; }
  .track { fill: var(--track); }
  /* Touch: big fixed controls outside the scaled stage, so a finger fits. */
  html { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #touch, #rotate { display: none; }
  body.touch #touch { display: block; }
  body.touch #nav { display: none; }   /* the big controls replace them */
  #touch button {
    position: fixed; z-index: 10; border: none; background: transparent; color: #949494;
    font: inherit; padding: 0; cursor: pointer;
  }
  #tprev, #tnext { top: 0; bottom: 0; width: max(64px, calc((100vw - 100vh * 16 / 9) / 2)); font-size: 44px; }
  #tprev { left: 0; } #tnext { right: 0; }
  #tprev:active, #tnext:active { background: rgba(3, 169, 244, 0.1); color: #0277bd; }
  #tnerd {
    top: 10px; right: 10px; width: 56px; height: 56px; font-size: 22px;
    border: 1px solid #b8b8b8 !important; background: rgba(255, 255, 255, 0.9) !important;
  }
  #tnerd.on { color: #0277bd; border-color: #03a9f4 !important; }
  #tcount { position: fixed; z-index: 10; bottom: 10px; right: 14px; font-size: 16px; color: #949494; }
  @media (orientation: portrait) {
    body.touch #rotate { display: flex; position: fixed; inset: 0; z-index: 20; background: #fff;
                         flex-direction: column; align-items: center; justify-content: center;
                         padding: 32px; text-align: center; }
    #rotate .rtitle { font-size: clamp(24px, 7.5vw, 30px); font-weight: 700; line-height: 1.15; margin-top: 22px; }
    #rotate .rsub { font-size: 17px; color: #595959; margin-top: 8px; }
    #rotate .rturn { margin-top: 56px; }
    #rotate .rhint { font-size: 15px; color: #0277bd; margin-top: 10px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="main">
    <svg id="svg" viewBox="0 0 1180 900" aria-label="slide"></svg>
    <div id="nerds"></div>
  </div>
  <div id="modal" role="dialog" aria-modal="true"><div id="mbox">
    <div id="mcount"></div>
    <div class="frame" id="mframe"></div>
    <div class="cap"><b id="mtitle"></b><span class="src"><span id="msrc"></span><span class="cmd" id="mcmd"></span></span></div>
    <button id="mclose" aria-label="close">×</button>
    <button id="mprev" aria-label="previous">‹</button>
    <button id="mnext" aria-label="next">›</button>
  </div></div>
  <aside id="panel">
    <svg id="logo" width="34" height="34" viewBox="0 0 200 200" aria-label="Vega-Altair">
      <polygon points="13,175 71,25 71,175" fill="#fbc02d"/><rect x="71" y="25" width="45" height="150" fill="#03a9f4"/>
      <rect x="106" y="75" width="45" height="100" fill="#4fc3f7"/><rect x="141" y="125" width="45" height="50" fill="#b3e5fc"/>
    </svg>
    <div class="kick" id="kicker"></div>
    <div id="title"></div>
    <div id="big"></div>
    <div id="bigsub"></div>
    <div id="rows"></div>
    <div id="media"></div>
    <div id="hover"></div>
    <div id="foot">
      <div id="dots"></div>
      <div id="nav"><button id="prev" aria-label="back">‹</button> <button id="next" aria-label="next">›</button> <button id="nerdbtn">how to reproduce</button></div>
    </div>
  </aside>
</div>

<div id="touch">
  <button id="tprev" aria-label="back">‹</button>
  <button id="tnext" aria-label="next">›</button>
  <button id="tnerd" aria-label="how to reproduce">{ }</button>
  <div id="tcount"></div>
</div>
<div id="rotate" aria-label="Towards the next Altair: turn your phone sideways">
  <svg class="rlogo" width="120" height="120" viewBox="0 0 200 200" aria-hidden="true">
    <polygon points="13,175 71,25 71,175" fill="#fbc02d"/><rect x="71" y="25" width="45" height="150" fill="#03a9f4"/>
    <rect x="106" y="75" width="45" height="100" fill="#4fc3f7"/><rect x="141" y="125" width="45" height="50" fill="#b3e5fc"/>
  </svg>
  <div class="rtitle">Towards the next Altair</div>
  <div class="rsub">one route across Avenger's crates</div>
  <svg class="rturn" width="150" height="110" viewBox="0 0 150 110" aria-hidden="true">
    <rect x="18" y="14" width="36" height="64" fill="none" stroke="#b3e5fc" stroke-width="3"/>
    <rect x="64" y="46" width="68" height="38" fill="#e1f5fe" stroke="#03a9f4" stroke-width="3"/>
    <path d="M60,16 a40,40 0 0 1 36,22" fill="none" stroke="#fbc02d" stroke-width="3.5"/>
    <path d="M89,38 l8,2 l1,-9" fill="none" stroke="#fbc02d" stroke-width="3.5"/>
  </svg>
  <div class="rhint">turn your phone sideways</div>
</div>

<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");
// The Vega-Altair logo's colours: light blues and one amber.
const C = {
  ink: "#000", muted: "#595959", kicker: "#949494", line: "#b8b8b8", accent: "#03a9f4", accentText: "#0277bd",
  blue: "#03a9f4", blue3: "#4fc3f7", blue1: "#b3e5fc", blue0: "#e1f5fe", blue7: "#0288d1", amber: "#fbc02d",
  bar: "#0288d1", barSoft: "#b3e5fc", track: "#e1f5fe", warn: "#03a9f4", grid: "rgba(184,184,184,0.45)",
  dark: "#01579b", darkText: "#ffffff", darkMuted: "#b3e5fc", darkAccent: "#b3e5fc", tint: "#e1f5fe",
};

// The logo itself: an amber triangle and three blue bars.
function logo(x, y, size, parent) {
  const g = el("g", { transform: `translate(${x},${y}) scale(${size / 200})` }, parent);
  el("polygon", { points: "13,175 71,25 71,175", fill: C.amber }, g);
  el("rect", { x: 71, y: 25, width: 45, height: 150, fill: C.blue }, g);
  el("rect", { x: 106, y: 75, width: 45, height: 100, fill: C.blue3 }, g);
  el("rect", { x: 141, y: 125, width: 45, height: 50, fill: C.blue1 }, g);
  return g;
}

// ---------------------------------------------------------------- drawing

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs || {}) {
    if (k === "text") e.textContent = attrs[k];
    else if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
  }
  (parent || svg).appendChild(e);
  return e;
}

let NODES = {}, EDGES = [], EDGE_LAYER = null;

function layer(s, parent) {
  const g = el("g", {}, parent);
  if (s !== undefined && s !== null) g.setAttribute("data-s", s);
  return g;
}

function text(x, y, t, cls, o = {}) {
  const fill = o.fill === C.accent ? C.accentText : o.fill;
  const e = el("text", { x, y, class: cls || "lab", "text-anchor": o.anchor || "start",
                         style: (fill ? "fill:" + fill + ";" : "") + (o.size ? "font-size:" + o.size + "px;" : "")
                                + (o.bold ? "font-weight:700;" : "") || null,
                         "font-style": o.italic ? "italic" : null }, o.parent);
  const lines = String(t).split("\n");
  if (lines.length === 1) e.textContent = t;
  else lines.forEach((l, i) => el("tspan", { x, dy: i ? (o.lh || 18) : 0, text: l }, e));
  return e;
}

// A node: square corners, a line, a label and an optional sub-label.
function box(id, x, y, w, h, o = {}) {
  const g = layer(o.s, o.parent);
  const inner = el("g", { class: "dim hot", "data-id": id }, g);
  el("rect", { x, y, width: w, height: h, class: "box " + (o.kind || "") }, inner);
  const cx = x + w / 2;
  const light = o.kind && o.kind.includes("dark");
  if (o.label !== undefined) {
    const hasSub = o.sub !== undefined;
    const ly = y + h / 2 + (hasSub ? -5 : 6);
    text(o.align === "left" ? x + 14 : cx, ly, o.label, o.labcls || "lab",
         { anchor: o.align === "left" ? "start" : "middle", parent: inner, bold: o.bold,
           fill: light ? "#fff" : (o.labfill || null), size: o.size });
    if (hasSub) text(o.align === "left" ? x + 14 : cx, ly + 23, o.sub, "sub",
                     { anchor: o.align === "left" ? "start" : "middle", parent: inner,
                       fill: light ? "#b8b8b8" : (o.subfill || null) });
  }
  if (o.title) el("title", { text: o.title }, inner);
  NODES[id] = { x, y, w, h, cx, cy: y + h / 2, g: inner };
  return inner;
}

function person(id, cx, cy, label, o = {}) {
  const g = layer(o.s, o.parent);
  const inner = el("g", { class: "dim hot", "data-id": id }, g);
  el("circle", { cx, cy: cy - 22, r: 13, fill: "#fff", stroke: o.color || C.ink, "stroke-width": 1.5 }, inner);
  el("path", { d: `M${cx - 26},${cy + 22} q0,-30 26,-30 q26,0 26,30`, fill: "#fff",
               stroke: o.color || C.ink, "stroke-width": 1.5 }, inner);
  text(cx, cy + 46, label, "lab", { anchor: "middle", parent: inner });
  if (o.sub) text(cx, cy + 65, o.sub, "sub", { anchor: "middle", parent: inner });
  NODES[id] = { x: cx - 34, y: cy - 40, w: 68, h: 66, cx, cy, g: inner };
  return inner;
}

function anchor(n, tx, ty) {
  const dx = tx - n.cx, dy = ty - n.cy;
  if (!dx && !dy) return [n.cx, n.cy];
  const t = Math.min(n.w / 2 / Math.abs(dx || 1e-9), n.h / 2 / Math.abs(dy || 1e-9));
  return [n.cx + dx * t, n.cy + dy * t];
}

// An edge between two nodes; `bend` curves it sideways, `from`/`to` pick
// a side ("t", "b", "l", "r") instead of the straight line between centres.
function edge(a, b, o = {}) {
  const A = NODES[a], B = NODES[b];
  const side = (n, s, other) => s === "t" ? [n.cx + (o.dx1 || 0), n.y] : s === "b" ? [n.cx + (o.dx1 || 0), n.y + n.h]
    : s === "l" ? [n.x, n.cy] : s === "r" ? [n.x + n.w, n.cy] : anchor(n, other.cx, other.cy);
  const p1 = o.from ? side(A, o.from, B) : anchor(A, B.cx, B.cy);
  let p2 = o.to ? (o.to === "t" ? [B.cx + (o.dx2 || 0), B.y] : o.to === "b" ? [B.cx + (o.dx2 || 0), B.y + B.h]
    : o.to === "l" ? [B.x, B.cy] : [B.x + B.w, B.cy]) : anchor(B, A.cx, A.cy);
  const g = layer(o.s, o.parent || EDGE_LAYER);
  const inner = el("g", { class: "dim", "data-a": a, "data-b": b }, g);
  let d;
  if (o.curve === "v") {
    const my = (p1[1] + p2[1]) / 2;
    d = `M${p1[0]},${p1[1]} C${p1[0]},${my} ${p2[0]},${my} ${p2[0]},${p2[1]}`;
  } else if (o.curve === "h") {
    const mx = (p1[0] + p2[0]) / 2;
    d = `M${p1[0]},${p1[1]} C${mx},${p1[1]} ${mx},${p2[1]} ${p2[0]},${p2[1]}`;
  } else if (o.bend) {
    const mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2;
    const nx = -(p2[1] - p1[1]), ny = p2[0] - p1[0], L = Math.hypot(nx, ny) || 1;
    d = `M${p1[0]},${p1[1]} Q${mx + nx / L * o.bend},${my + ny / L * o.bend} ${p2[0]},${p2[1]}`;
  } else if (o.via) {
    d = `M${p1[0]},${p1[1]} ` + o.via.map(p => `L${p[0]},${p[1]}`).join(" ") + ` L${p2[0]},${p2[1]}`;
  } else d = `M${p1[0]},${p1[1]} L${p2[0]},${p2[1]}`;
  const kind = o.kind || "";
  const marker = kind.includes("acc") ? "url(#arrA)" : kind.includes("warn") ? "url(#arrW)" : "url(#arr)";
  const path = el("path", { d, class: "edge " + kind + (o.flow ? " flow" : ""),
                            "marker-end": o.noarrow ? null : marker }, inner);
  if (o.label) {
    const len = path.getTotalLength ? path.getTotalLength() : 0;
    const pt = len ? path.getPointAtLength(len * (o.at || 0.5)) : { x: (p1[0] + p2[0]) / 2, y: (p1[1] + p2[1]) / 2 };
    text(pt.x + (o.lx || 0), pt.y + 4 + (o.ly || 0), o.label, "elab", { anchor: "middle", parent: inner });
  }
  EDGES.push({ a, b, g: inner });
  return path;
}

function image(href, x, y, w, h, o = {}) {
  const g = layer(o.s, o.parent);
  const id = "clip" + Math.random().toString(36).slice(2);
  const cp = el("clipPath", { id }, el("defs", {}, g));
  el("rect", { x, y, width: w, height: h }, cp);
  el("image", { href, x, y, width: w, height: h, preserveAspectRatio: o.fit || "xMidYMid slice",
                "clip-path": `url(#${id})` }, g);
  if (o.frame !== false) el("rect", { x, y, width: w, height: h, fill: "none", stroke: "#dcdfe3" }, g);
  return g;
}

// Drawn pictures, in the calm theme's blue and grey. They stand for the

function rnd(seed) { let v = seed; return () => (v = (v * 16807) % 2147483647) / 2147483647; }

const G = {
  // A top view: blocks, streets, a diagonal road, buildings in the accent.
  tile(x, y, w, h, o = {}) {
    const g = layer(o.s, o.parent), n = o.n || 32, cw = w / n, ch = h / n, r = rnd(o.seed || 11);
    const upto = o.fill === undefined ? 1 : o.fill;
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      const street = i % 6 === 0 || j % 6 === 0 || Math.abs(i - j - 4) < 1;
      const v = r();
      if (j / n > upto) continue;
      const f = street ? C.blue0 : v > 0.93 ? C.amber : v > 0.6 ? C.blue : v > 0.3 ? C.blue3 : C.blue1;
      el("rect", { x: x + i * cw, y: y + j * ch, width: cw - (n > 40 ? 0.6 : 1), height: ch - (n > 40 ? 0.6 : 1), fill: f }, g);
    }
    if (o.frame !== false) el("rect", { x, y, width: w, height: h, fill: "none", stroke: C.line }, g);
    return g;
  },
  bars(x, y, w, h, vals, o = {}) {
    const g = layer(o.s, o.parent), bw = w / vals.length, max = Math.max(...vals);
    vals.forEach((v, i) => el("rect", { x: x + i * bw + bw * 0.15, y: y + h - h * v / max, width: bw * 0.7,
      height: h * v / max, fill: i === (o.hi === undefined ? -1 : o.hi) ? C.amber : [C.blue, C.blue3, C.blue1][i % 3] }, g));
    el("line", { x1: x, y1: y + h, x2: x + w, y2: y + h, stroke: C.line }, g);
    return g;
  },
  line(x, y, w, h, o = {}) {
    const g = layer(o.s, o.parent), r = rnd(o.seed || 3);
    for (let k = 0; k < (o.series || 3); k++) {
      let p = "", v = 0.5;
      for (let i = 0; i <= 20; i++) { v = Math.min(0.95, Math.max(0.05, v + (r() - 0.5) * 0.25)); p += (i ? "L" : "M") + (x + w * i / 20) + "," + (y + h * (1 - v)); }
      el("path", { d: p, fill: "none", stroke: k === 0 ? C.blue : C.blue1, "stroke-width": k === 0 ? 2.2 : 1.6 }, g);
    }
    el("line", { x1: x, y1: y + h, x2: x + w, y2: y + h, stroke: C.line }, g);
    return g;
  },
  arc(cx, cy, R, vals, o = {}) {
    const g = layer(o.s, o.parent), tot = vals.reduce((a, b) => a + b, 0), ri = R * (o.inner || 0.55);
    let a0 = -Math.PI / 2;
    vals.forEach((v, i) => {
      const a1 = a0 + 2 * Math.PI * v / tot, big = a1 - a0 > Math.PI ? 1 : 0;
      const P = (r, a) => `${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`;
      el("path", { d: `M${P(R, a0)} A${R},${R} 0 ${big} 1 ${P(R, a1)} L${P(ri, a1)} A${ri},${ri} 0 ${big} 0 ${P(ri, a0)} Z`,
        fill: i === (o.hi || 0) ? C.amber : [C.blue, C.blue3, C.blue1, C.blue7][i % 4], stroke: "#fff", "stroke-width": 1.5 }, g);
      a0 = a1;
    });
    return g;
  },
  // Bars leaning back, the tilt into 3D.
  tilt(x, y, w, h, vals, o = {}) {
    const g = layer(o.s, o.parent), bw = w / vals.length, max = Math.max(...vals), dx = bw * 0.35, dy = -bw * 0.25;
    vals.forEach((v, i) => {
      const bx = x + i * bw * 0.8 + i * dx * 0.2, by = y + h - i * dy * -0.6, bh = (h * 0.8) * v / max;
      const f = i === (o.hi || 0) ? C.amber : C.blue3;
      el("path", { d: `M${bx},${by} l0,${-bh} l${dx},${dy} l0,${bh} z`, fill: i === (o.hi || 0) ? "#f9a825" : C.blue7 }, g);
      el("path", { d: `M${bx - bw * 0.45},${by - dy * 0} l${bw * 0.45},0 l0,${-bh} l${-bw * 0.45},0 z`, fill: f }, g);
      el("path", { d: `M${bx - bw * 0.45},${by - bh} l${bw * 0.45},0 l${dx},${dy} l${-bw * 0.45},0 z`, fill: C.blue1 }, g);
    });
    return g;
  },
  // Lines of pipeline or chart text on the dark overlay, one typeface.
  code(x, y, w, lines, o = {}) {

};

// Hover a node: everything not connected to it fades.
function wireHover(hoverText) {
  if (document.body.classList.contains("touch")) return;   // a tap is not a hover
  svg.querySelectorAll(".hot").forEach(n => {
    const id = n.getAttribute("data-id");
    n.addEventListener("mouseenter", () => {
      svg.classList.add("focus");
      n.classList.add("hl");
      EDGES.forEach(e => {
        if (e.a === id || e.b === id) {
          e.g.classList.add("hl");
          const other = e.a === id ? e.b : e.a;
          if (NODES[other]) NODES[other].g.classList.add("hl");
        }
      });
      if (hoverText && hoverText[id]) document.getElementById("hover").textContent = hoverText[id];
    });
    n.addEventListener("mouseleave", () => {
      svg.classList.remove("focus");
      svg.querySelectorAll(".hl").forEach(x => x.classList.remove("hl"));
      document.getElementById("hover").textContent = "";
    });
  });
}

  series: ["experiments/07-chart-decisions/images/series.png", "series predicates", "cargo run --release -p lidar-decide --bin layer_roundtrip"],
  notebook: ["crates/avenger-altair/video/notebook.mp4", "Altair in a notebook, drawn by Avenger", "cd crates/avenger-altair && maturin develop --release"],
  altbars: ["crates/avenger-altair/images/bars.png", "an Altair chart, drawn by Avenger", "cargo run --release -p avenger-altair -- render spec.json out.png"],
  camera: ["crates/avenger-altair/images/camera.png", "camera in Altair: fisheye and tilt", "crates/avenger-altair/README.md"],
  altlive: ["crates/avenger-altair/bench/live.png", "a live Altair chart as rows arrive", "python crates/avenger-altair/bench/live.py 10000 100"],
};
const MEDIA = {
  "Our composition": ["explorer", "liveGif", "povw", "aptour", "watch", "notebook"],
  "Meeting halfway": ["altbars", "notebook"],
  "Beyond Vega-Lite": ["ittour", "morph", "lenses", "decisions", "camera"],
  "Scenarios as tests": ["classes", "liveGif", "watch", "tour", "hill", "pchart", "autopilot", "writer", "notebook"],
  "Grammar of graphics": ["cbars", "morph", "maps", "glyphs", "tour", "fisheye"],
  "Grammar of interaction": ["ittour", "magnifier", "lenses", "soft", "lasso", "series"],
  "A chart vocabulary": ["aptour", "autopilot", "apshot", "decisions", "writer", "editor"],
  "Altair from the schema": ["notebook", "altbars", "camera", "altlive"],
  "Fast, streaming, independent": ["liveMp4", "explorer", "altlive", "section"],
};
// Which part each slide belongs to, by title.
const PART_1 = ["Our composition", "Meeting halfway", "Beyond Vega-Lite", "Scenarios as tests"];
const PART_3 = ["Findings", "Small steps", "One route of many"];

let mList = [], mIdx = 0;
const modal = document.getElementById("modal");
function openMedia(list, i) {
  mList = list; mIdx = i;
  if (String(list[i]).startsWith("f:")) return openFinding(list, i);
  const [src, title, cmd, pipe, hi] = E[list[i]];
  const url = CDN + src, frame = document.getElementById("mframe");
  frame.innerHTML = "";
  const m = document.createElement(/\.mp4$/.test(src) ? "video" : "img");
  if (m.tagName === "VIDEO") Object.assign(m, { controls: true, autoplay: true, muted: true, loop: true, playsInline: true });
  else m.alt = title;
  m.src = url;
  frame.appendChild(m);
  if (pipe) {
    const c = document.createElement("div");
    c.className = "pipe";
    const k = document.createElement("div"); k.className = "pk"; k.textContent = "the pipeline";
    c.appendChild(k);
    pipe.forEach((l, j) => { const d = document.createElement("div"); d.textContent = l; if (j === hi) d.className = "hi"; c.appendChild(d); });
    frame.appendChild(c);
  }
  document.getElementById("mtitle").textContent = title;
  document.getElementById("msrc").textContent = src;
  document.getElementById("mcmd").textContent = "how to reproduce: " + cmd;
  document.getElementById("mcount").textContent = (i + 1) + " / " + list.length;
  modal.classList.add("on");
}
function openFinding(list, i) {
  const n = Number(String(list[i]).slice(2)), F = FIND[n];
  const frame = document.getElementById("mframe");
  frame.innerHTML = "";
  const d = document.createElement("div");
  d.className = "finding";
  d.innerHTML = `<div class="fk"></div><h2></h2><div class="lbl">what we saw</div><p class="saw"></p>
    <div class="lbl">why it matters on this route</div><p class="why"></p>` + (F.q ? `<div class="lbl">a question</div><p class="q"></p>` : "");
  d.querySelector(".fk").textContent = THEME_OF[n] + " · " + F.f;
  const st = document.createElement("span"); st.className = "st"; st.textContent = STATUS[F.s];
  d.querySelector(".fk").appendChild(st);
  d.querySelector("h2").textContent = F.t;
  d.querySelector(".saw").textContent = F.saw;
  d.querySelector(".why").textContent = F.why;
  if (F.q) d.querySelector(".q").textContent = F.q;
  frame.appendChild(d);
  document.getElementById("mtitle").textContent = "";
  document.getElementById("msrc").textContent = "FINDINGS.md, finding " + n;
  document.getElementById("mcmd").textContent = "how to reproduce: " + F.m;
  document.getElementById("mcount").textContent = (i + 1) + " / " + list.length;
  modal.classList.add("on");
}
function closeMedia() { modal.classList.remove("on"); document.getElementById("mframe").innerHTML = ""; }
function stepMedia(d) { if (mList.length) openMedia(mList, (mIdx + d + mList.length) % mList.length); }
document.getElementById("mclose").onclick = closeMedia;
document.getElementById("mprev").onclick = () => stepMedia(-1);
document.getElementById("mnext").onclick = () => stepMedia(1);
// The dark margin around the box closes it, like the close button.
modal.addEventListener("click", e => { if (e.target === modal) closeMedia(); });

function mediaList(S) {
  const box = document.getElementById("media");
  box.innerHTML = "";
  const list = S.media || [];
  if (!list.length) return;
  const k = document.createElement("div");
  k.className = "kick"; k.textContent = "evidence";
  box.appendChild(k);
  list.forEach((key, i) => {
    const b = document.createElement("button");
    b.innerHTML = `<i class="ico ${/\.mp4$/.test(E[key][0]) ? "video" : "img"}"></i><span></span>`;
    b.children[1].textContent = E[key][1];
    b.onclick = () => openMedia(list, i);
    box.appendChild(b);
  });
}

// ---------------------------------------------------------------- engine

let cur = 0, step = 0;
const nerds = document.getElementById("nerds");

function render() {
  const S = SLIDES[cur];
  svg.innerHTML = ""; NODES = {}; EDGES = []; CURF = [];
  svg.classList.remove("focus");
  defs();
  EDGE_LAYER = el("g", {});
  S.draw();
  wireHover(S.hover);
  const part = cur === 0 ? "" : PART_1.includes(S.title) ? "part 1 · " : PART_3.includes(S.title) ? "part 3 · " : "part 2 · ";
  document.getElementById("kicker").textContent = part + String(cur + 1).padStart(2, "0") + " / " + SLIDES.length;
  document.getElementById("title").textContent = S.title;
  document.getElementById("big").textContent = S.big || "";
  document.getElementById("bigsub").textContent = S.bigsub || "";
  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  (S.rows || []).forEach(r => {
    const d = document.createElement("div");
    d.className = "row"; d.dataset.s = r[2] || 0;
    d.innerHTML = `<span></span><span></span>`;
    d.children[0].textContent = r[0]; d.children[1].textContent = r[1];
    rows.appendChild(d);
  });
  nerds.innerHTML = S.nerds || "";
  S.media = (MEDIA[S.title] || []).filter(k => E[k]);
  if (!S.noList) mediaList(S); else document.getElementById("media").innerHTML = "";
  if (S.links) S.links.forEach(([id, key]) => {
    const n = NODES[id]; if (!n) return;
    n.g.classList.add("media-link");
    const g = n.g, x = n.x + n.w - 26, y = n.y + 8;
    el("rect", { x, y, width: 18, height: 18, fill: /\.mp4$/.test(E[key][0]) ? C.amber : "#fff",
                 stroke: /\.mp4$/.test(E[key][0]) ? "none" : C.accent, "stroke-width": 2 }, g);
    if (/\.mp4$/.test(E[key][0])) el("path", { d: `M${x + 6},${y + 4} l8,5 l-8,5 z`, fill: "#fff" }, g);
    g.addEventListener("click", () => openMedia(S.media, Math.max(0, S.media.indexOf(key))));
  });
  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  SLIDES.forEach((_, i) => {
    const d = document.createElement("i");
    if (i === cur) d.className = "on";
    d.onclick = () => go(i, 0);
    dots.appendChild(d);
  });
  show();
}

function show() {
  document.querySelectorAll("[data-s]").forEach(e => {
    e.classList.toggle("on", Number(e.dataset.s) <= step);
  });
  document.querySelectorAll("svg [data-s]").forEach(e => {
    e.classList.toggle("on", Number(e.getAttribute("data-s")) <= step);
  });
  history.replaceState(null, "", location.search + "#" + (cur + 1) + (step ? "." + step : ""));
  const tc = document.getElementById("tcount");
  if (tc) tc.textContent = (cur + 1) + " / " + SLIDES.length;
}

function go(i, s) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  step = s === "end" ? SLIDES[cur].steps - 1 : s;
  render();
}

function next() {
  if (step < SLIDES[cur].steps - 1) { step++; show(); }
  else if (cur < SLIDES.length - 1) go(cur + 1, 0);
}
function prev() {
  if (step > 0) { step--; show(); }
  else if (cur > 0) go(cur - 1, "end");
}

document.addEventListener("keydown", e => {
  if (modal.classList.contains("on")) {
    if (e.key === "Escape") closeMedia();
    else if (e.key === "ArrowRight") stepMedia(1);
    else if (e.key === "ArrowLeft") stepMedia(-1);
    e.preventDefault();
    return;
  }
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); next(); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === "Home") go(0, 0);
  else if (e.key === "End") go(SLIDES.length - 1, "end");
  else if (e.key === "Tab") { e.preventDefault(); nerds.classList.toggle("on"); }
  else if (e.key === "Escape") nerds.classList.remove("on");
  else if (e.key === "f") document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
});
document.getElementById("next").onclick = next;
document.getElementById("prev").onclick = prev;
document.getElementById("nerdbtn").onclick = () => nerds.classList.toggle("on");


// Touch: tap the slide to go on (its left third goes back), swipe either
// way, or use the big controls in the margins. ?touch forces this look.
const coarse = window.matchMedia("(pointer: coarse)").matches || /[?&]touch\b/.test(location.search);
if (coarse) document.body.classList.add("touch");
document.getElementById("tprev").onclick = prev;
document.getElementById("tnext").onclick = next;
document.getElementById("tnerd").onclick = () => {
  nerds.classList.toggle("on");
  document.getElementById("tnerd").classList.toggle("on", nerds.classList.contains("on"));
};
let t0 = null;
const stage = document.getElementById("stage");
stage.addEventListener("touchstart", e => { t0 = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() }; }, { passive: true });
stage.addEventListener("touchend", e => {
  if (!t0) return;
  const t = e.changedTouches[0], dx = t.clientX - t0.x, dy = t.clientY - t0.y;
  const quick = Date.now() - t0.t < 600;
  t0 = null;
  if (e.target.closest("button, #dots i, #modal, #media, .media-link")) return;
  if (nerds.classList.contains("on")) { nerds.classList.remove("on"); document.getElementById("tnerd").classList.remove("on"); return; }
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); return; }
  if (quick && Math.abs(dx) < 12 && Math.abs(dy) < 12) {
    const r = stage.getBoundingClientRect();
    (t.clientX - r.left) < r.width * 0.3 ? prev() : next();
  }
}, { passive: true });

function fit() {
  const st = document.getElementById("stage");
  const k = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
  st.style.transform = `scale(${k}) translate(-50%, -50%)`;
}
window.addEventListener("resize", fit);
fit();

// #3 opens slide 3, #3.2 its third step; ?all shows every step (for stills).
(function start() {
  const m = location.hash.match(/^#(\d+)(?:\.(\d+))?/);
  const all = /[?&]all\b/.test(location.search);
  const i = m ? Number(m[1]) - 1 : 0;
  go(i, all ? "end" : (m && m[2] ? Number(m[2]) : 0));
  // ?evidence=N opens the slide's N-th piece of evidence (1-based).
  const ev = location.search.match(/[?&]evidence=(\d+)/);
  if (ev && SLIDES[cur].media && SLIDES[cur].media[ev[1] - 1]) openMedia(SLIDES[cur].media, ev[1] - 1);
  // ?finding=N opens finding N, with ← → through all of them.
  const fd = location.search.match(/[?&]finding=(\d+)/);
  if (fd && FIND[fd[1]]) { const all = Object.keys(FIND).map(k => "f:" + k); openMedia(all, all.indexOf("f:" + fd[1])); }
})();
</script>
